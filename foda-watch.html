<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#00fff7">
<title>FodaWatch — FodaSocial</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./fs-core.css">
</head>
<body class="locked" data-song="watch">
<header>
  <span class="logo">FODASOCIAL</span>
  <span class="statuspill"><span id="netdot" class="dot" title="rede"></span><small id="netlabel" class="mut">…</small></span>
  <button id="musbtn" onclick="musToggle()" title="trilha sonora">🎵</button>
  <button id="me" onclick="location.href='./foda-perfil.html'" title="meu perfil">👤</button>
</header>
<nav id="tabs">
  <button data-t="feed" onclick="location.href='./foda-feed.html'">📰 FodaFeed</button>
  <button data-t="videos" class="active">📺 FodaWatch</button>
  <button data-t="shorts" onclick="location.href='./foda-scroll.html'">📱 FodaScroll</button>
  <button data-t="servidores" onclick="location.href='./foda-chat.html'">💬 FodaChat</button>
  <button data-t="amigos" onclick="location.href='./foda-amigos.html'">🤝 Amigos</button>
  <button data-t="perfil" onclick="location.href='./foda-perfil.html'">😎 Perfil</button>
  <button data-t="jogos" onclick="location.href='./foda-jogos.html'">🎮 Jogos</button>
</nav>
<main id="view"></main>
<div id="toast"></div>
<footer>FodaSocial — só gente real. Sem bots, sem feed fake. Use com respeito.</footer>
<script src="./fs-core.js"></script>
<script>
/* ================= FodaWatch: vídeos longos ================= */
function vidRender(){
  const box=$('view'),m=me();
  let h=`<div class="card"><h3>📺 FodaWatch</h3><p class="mut">Na nuvem pra todo mundo ver.</p>`;
  if(m)h+=`<label class="lbl">NOVO VÍDEO</label><input type="text" id="v-title" maxlength="80" placeholder="título do vídeo"><textarea id="v-desc" maxlength="300" placeholder="descrição..."></textarea><div class="row"><label class="pill" style="cursor:pointer">🎬 escolher vídeo<input type="file" id="v-file" accept="video/*" hidden></label><label class="pill"><input type="checkbox" id="v-short"> short (&lt;60s)</label></div><button class="mbtn" style="width:100%" onclick="vidPost()">Publicar vídeo</button>`;
  else h+=`<p class="mut">Entra pra publicar.</p>`;
  h+=`</div><div id="v-list"></div>`;
  box.innerHTML=h;vidList();
}
async function vidPost(){
  const m=needMe();if(!m)return;
  const f=$('v-file').files[0];if(!f)return toast('⚠️ Escolhe o arquivo de vídeo');
  const title=($('v-title').value||f.name).trim().slice(0,80),desc=($('v-desc').value||'').trim().slice(0,300),short=$('v-short').checked;
  if(f.size>FS_MAX_VIDEO_MB*1048576)return toast('⚠️ Vídeo passa de '+FS_MAX_VIDEO_MB+' MB (cota justa p/ todos)');
  toast('⏳ Medindo tua cota...');
  const u=await stoUsage(m.nick);
  if(u.count>=FS_MAX_VIDEOS)return toast('⚠️ Limite de '+FS_MAX_VIDEOS+' vídeos por pessoa');
  if(u.bytes+f.size>FS_MAX_USER_MB*1048576)return toast('⚠️ Tua cota acabou ('+fmtMB(u.bytes)+'/'+FS_MAX_USER_MB+' MB). Apaga algo!');
  toast('⏳ Publicando...');
  const path=m.nick+'/'+Date.now()+'_'+f.name.replace(/[^a-zA-Z0-9.]/g,'_');
  const {error}=await SUPA.storage.from('midia').upload(path,f);
  if(error)return toast('❌ '+error.message);
  const url=SUPA.storage.from('midia').getPublicUrl(path).data.publicUrl;
  await SUPA.from('videos').insert({title,desc,url,nick:m.nick,ava:m.ava,ts:Date.now(),likes:[],short});
  vidRender();toast('📺 No ar!');
}
async function vidList(){
  const el=$('v-list');if(!el)return;el.innerHTML='<p class="mut">Carregando...</p>';
  const m=me(),vs=await fsVideos();
  if(!vs.length){el.innerHTML='<div class="empty">📭 Nenhum vídeo.<br>Publica o primeiro!</div>';return;}
  el.innerHTML=vs.map(v=>{
    const liked=m&&v.likes.includes(m.nick);
    return `<div class="card"><video class="v" controls preload="metadata" src="${esc(v.url)}"></video><h3>${esc(v.title)}</h3><p class="mut">${esc(v.ava)} ${esc(v.nick)} • ${ago(v.ts)}${v.short?' • 📱 short':''}</p>${v.desc?`<p class="txt" style="font-size:13px">${esc(v.desc)}</p>`:''}<div class="acts"><button class="${liked?'liked':''}" onclick="vidLike('${v.id}')">👍 ${v.likes.length}</button><button onclick="vidComments('${v.id}')">💬</button>${m&&m.nick===v.nick?`<button onclick="vidDel('${v.id}')">🗑️</button>`:''}</div><div class="cbox" id="vc-${v.id}" style="display:none"></div></div>`;
  }).join('');
}
async function vidDel(id){
  if(!confirm('Apagar vídeo?'))return;
  await SUPA.from('videos').delete().eq('id',isNaN(+id)?id:+id);
  vidList();
}
async function vidComments(id){
  const box=$('vc-'+id);if(!box)return;box.style.display=box.style.display==='none'?'block':'none';
  if(box.style.display==='none')return;
  const m=me();
  const {data}=await SUPA.from('video_comments').select('*').eq('video_id',isNaN(+id)?id:+id).order('ts');
  const cm=(data||[]).map(c=>({nick:c.nick,text:c.text}));
  box.innerHTML=cm.map(c=>`<p class="c"><b>${esc(c.nick)}:</b> ${esc(c.text)}</p>`).join('')+((m)?`<div class="row"><input type="text" id="vci-${id}" maxlength="200" placeholder="Comenta..." style="flex:1"><button class="mbtn small" onclick="vidSend('${id}')">➤</button></div>`:'');
}
async function vidSend(id){
  const m=needMe();if(!m)return;
  const t=($('vci-'+id).value||'').trim().slice(0,200);if(!t)return;
  await SUPA.from('video_comments').insert({video_id:isNaN(+id)?id:+id,nick:m.nick,text:t,ts:Date.now()});
  vidComments(id);vidComments(id);
}
window.pageReady=vidRender;
bootGate();
</script>
</body>
</html>
