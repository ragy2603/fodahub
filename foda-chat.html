<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#00fff7">
<title>FodaChat — FodaSocial</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./fs-core.css">
<style>
main{max-width:1100px}
.d-panel{display:flex;background:transparent;border:1px solid var(--c1);border-radius:14px;overflow:hidden;min-height:calc(100vh - 260px);margin-bottom:10px;box-shadow:0 0 24px #00fff744}
.d-rail{width:64px;flex-shrink:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 0}
.d-srv{width:46px;height:46px;border-radius:50%;border:1px solid var(--c1);background:rgba(10,10,25,.65);color:#fff;font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;transition:.15s;position:relative}
.d-srv:hover{border-radius:16px;background:var(--c1);color:#000}
.d-srv.active{border-radius:16px;background:var(--c1);color:#000;box-shadow:0 0 12px var(--c1)}
.d-srv.active::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:4px;border-radius:4px;background:#fff}
.d-plus{width:46px;height:46px;border-radius:50%;border:1px solid #23a55a;background:rgba(10,10,25,.65);color:#23a55a;font-size:24px;cursor:pointer}
.d-plus:hover{background:#23a55a;color:#fff}
.d-side{width:190px;flex-shrink:0;background:rgba(10,10,25,.55);backdrop-filter:blur(6px);padding:12px 8px;overflow-y:auto}
.d-srvname{font-weight:800;font-size:14px;padding:4px 8px 10px;border-bottom:1px solid #ffffff18;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-label{font-size:10px;letter-spacing:1px;opacity:.55;padding:0 8px 4px}
.d-chan{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:0;color:#949ba4;border-radius:8px;padding:7px 8px;font-size:13px;cursor:pointer;font-family:inherit}
.d-chan span{opacity:.7;font-size:15px}
.d-chan:hover{background:#ffffff14;color:#dbdee1}
.d-chan.active{background:var(--c1);color:#000;font-weight:800;box-shadow:0 0 10px var(--c1)}
.d-chan.new{opacity:.7}
.d-main{flex:1;display:flex;flex-direction:column;min-width:0;background:transparent}
.d-chead{padding:10px 14px;border-bottom:1px solid var(--c1);font-weight:800;font-size:14px;display:flex;gap:6px;align-items:center;text-shadow:0 0 10px var(--c1)}
.d-chead span{opacity:.5;font-size:18px}
#msgs{flex:1;background:none;border:0;border-radius:0;margin:0;min-height:38vh;max-height:calc(100vh - 360px)}
.d-msg{display:flex;gap:10px;padding:8px 14px}
.d-msg:hover{background:#ffffff0a}
.d-av{width:38px;height:38px;flex-shrink:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px}
.d-body{min-width:0;flex:1}
.d-head{display:flex;gap:8px;align-items:baseline}
.d-head b{font-size:14px}
.d-head span{font-size:11px;opacity:.5}
.d-txt{font-size:14px;line-height:1.5;word-break:break-word;color:#dbdee1}
.d-input{display:flex;gap:8px;padding:10px 14px}
.d-input input{margin:0;background:#00000088;border-color:var(--c1)}
.d-input .mbtn{margin:0;background:#5865F2;box-shadow:none}
@media(max-width:560px){.d-side{width:140px}.d-panel{min-height:360px}}
</style>
</head>
<body class="locked" data-song="chat">
<header>
  <span class="logo">FODASOCIAL</span>
  <span class="statuspill"><span id="netdot" class="dot" title="rede"></span><small id="netlabel" class="mut">…</small></span>
  <button id="musbtn" onclick="musToggle()" title="trilha sonora">🎵</button>
  <button id="me" onclick="location.href='./foda-perfil.html'" title="meu perfil">👤</button>
</header>
<nav id="tabs">
  <button data-t="feed" onclick="location.href='./foda-feed.html'">📰 FodaFeed</button>
  <button data-t="videos" onclick="location.href='./foda-watch.html'">📺 FodaWatch</button>
  <button data-t="shorts" onclick="location.href='./foda-scroll.html'">📱 FodaScroll</button>
  <button data-t="servidores" class="active">💬 FodaChat</button>
  <button data-t="amigos" onclick="location.href='./foda-amigos.html'">🤝 Amigos</button>
  <button data-t="perfil" onclick="location.href='./foda-perfil.html'">😎 Perfil</button>
  <button data-t="jogos" onclick="location.href='./foda-jogos.html'">🎮 Jogos</button>
</nav>
<main id="view"></main>
<div id="toast"></div>
<footer>FodaSocial — só gente real. Sem bots, sem feed fake. Use com respeito.</footer>
<script src="./fs-core.js"></script>
<script>
/* ================= FodaChat: servidores + DM + calls ================= */
let srvCur=null,chanCur='geral',srvPoll=null,srvName='';
function chatRender(){srvRender();}
function srvRender(){
  const box=$('view'),m=me();
  box.innerHTML=`<div class="d-panel"><div class="d-rail"><div id="srv-list" style="display:flex;flex-direction:column;gap:8px;align-items:center"></div>${m?`<button class="d-plus" onclick="srvNew()" title="criar servidor">+</button>`:''}</div><div class="d-side" id="srv-side"><p class="mut">carregando...</p></div><div class="d-main" id="srv-box"></div></div><div id="dm-box"></div>`;
  srvList();dmBox();
}
async function servers(){
  const {data,error}=await SUPA.from('servers').select('*').order('name');
  if(error){toast('❌ '+error.message);return [];}
  return (data||[]).map(s=>({id:String(s.id),name:s.name}));
}
async function srvList(){
  const el=$('srv-list');if(!el)return;const l=await servers();
  el.innerHTML=l.map(s=>`<button class="d-srv${String(s.id)===String(srvCur)?' active':''}" onclick="srvOpen('${esc(s.id)}','${esc(s.name)}')" title="${esc(s.name)}">${esc(s.name.slice(0,2).toUpperCase())}</button>`).join('')||'<span class="mut">?</span>';
  if(!srvCur&&l.length)srvOpen(l[0].id);
}
async function srvNew(){
  const m=needMe();if(!m)return;
  const n=(prompt('Nome do servidor:')||'').trim().slice(0,24);if(!n)return;if(n.length<3)return toast('⚠️ Nome 3+');
  const {data,error}=await SUPA.from('servers').insert({name:n}).select().single();
  if(error)return toast('❌ '+error.message);
  await SUPA.from('channels').insert({server:String(data.id),name:'geral'});
  srvCur=String(data.id);
  chanCur='geral';srvRender();
}
async function channels(srv){
  const {data}=await SUPA.from('channels').select('*').eq('server',srv);
  return (data&&data.length)?data.map(c=>c.name):['geral'];
}
async function srvOpen(id,name){
  srvCur=id;if(name)srvName=name;const m=me(),chs=await channels(id);
  if(!chs.includes(chanCur))chanCur=chs[0]||'geral';
  const side=$('srv-side');
  if(side)side.innerHTML=`<div class="d-srvname">${esc(srvName||'servidor')}</div><div class="d-label">CANAIS DE TEXTO</div>`+chs.map(c=>`<button class="d-chan${c===chanCur?' active':''}" onclick="chanOpen('${esc(c)}')"><span>#</span> ${esc(c)}</button>`).join('')+(m?`<button class="d-chan new" onclick="chanNew()">+ novo canal</button>`:'');
  const box=$('srv-box');if(!box)return;
  box.innerHTML=`<div class="d-chead"><span>#</span> ${esc(chanCur)}</div><div id="msgs"></div>${m?`<div class="d-input"><input type="text" id="msg-in" maxlength="300" placeholder="Conversar em #${esc(chanCur)}..." style="flex:1" onkeydown="if(event.key==='Enter')msgSend()"><button class="mbtn small" onclick="msgSend()">➤</button></div>`:'<p class="mut">Entra pra conversar.</p>'}`;
  msgLoad();clearInterval(srvPoll);srvPoll=setInterval(()=>{if(!document.hidden)msgLoad(true);},4000);
  srvList();
}
async function chanOpen(c){chanCur=c;srvOpen(srvCur);}
async function chanNew(){
  const m=needMe();if(!m)return;
  const n=(prompt('Nome do canal:')||'').trim().toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,20);
  if(n.length<2)return;
  await SUPA.from('channels').insert({server:srvCur,name:n});
  srvOpen(srvCur);
}
function nickHue(n){let h=0;n=String(n||'?');for(let i=0;i<n.length;i++)h=(h*31+n.charCodeAt(i))%360;return h;}
async function msgLoad(){
  const el=$('msgs');if(!el)return;
  const {data}=await SUPA.from('messages').select('*').eq('server',srvCur).eq('channel',chanCur).order('ts').limit(80);
  const ms=(data||[]).map(x=>({nick:x.nick,text:x.text,ts:x.ts}));
  el.innerHTML=ms.length?ms.map(x=>{const hue=nickHue(x.nick);const tm=new Date(x.ts||Date.now()).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});return `<div class="d-msg"><div class="d-av" style="background:hsl(${hue},55%,38%)">${esc((x.nick||'?')[0]).toUpperCase()}</div><div class="d-body"><div class="d-head"><b style="color:hsl(${hue},85%,68%)">${esc(x.nick)}</b><span>${tm}</span></div><div class="d-txt">${esc(x.text)}</div></div></div>`;}).join(''):'<p class="mut">Silêncio... quebra o gelo 👇</p>';
  el.scrollTop=el.scrollHeight;
}
async function msgSend(){
  const m=needMe();if(!m)return;
  const inp=$('msg-in'),t=(inp.value||'').trim().slice(0,300);if(!t)return;
  await SUPA.from('messages').insert({server:srvCur,channel:chanCur,nick:m.nick,text:t,ts:Date.now()});
  inp.value='';msgLoad();
}
/* ---------- DMs ---------- */
let dmWith=null,dmPoll=null;
async function dmBox(){
  const box=$('dm-box');if(!box)return;const m=me();if(!m)return;
  try{
    const pend=sessionStorage.getItem('fod_dm');
    if(pend){dmWith=pend;sessionStorage.removeItem('fod_dm');}
  }catch(e){}
  const fr=await myFriends();
  box.innerHTML=`<div class="card"><h3>✉️ Papo reto (DM)</h3><div class="row"><select id="dm-who" style="flex:1">${fr.map(n=>`<option ${n===dmWith?'selected':''}>${esc(n)}</option>`).join('')||'<option value="">sem amigos — adiciona na aba 🤝</option>'}</select><button class="mbtn small" onclick="dmWith=$('dm-who').value;dmThread()">Abrir</button></div><div id="dm-thread"></div></div>`;
  const s=$('dm-who');
  if(!dmWith&&s&&s.value)dmWith=s.value;
  if(dmWith)dmThread();
}
function dmPair(a,b){return[a,b].sort().join('|');}
async function dmThread(){
  const m=me();if(!m||!dmWith)return;
  const {data}=await SUPA.from('dms').select('*').eq('pair',dmPair(m.nick,dmWith)).order('ts').limit(100);
  const el=$('dm-thread');if(!el)return;
  el.innerHTML=`<div id="dm-msgs" style="max-height:260px;overflow-y:auto;margin:8px 0">`+(((data||[]).map(x=>`<p class="m" style="font-size:13px;text-align:${x.from_nick===m.nick?'right':'left'}"><b>${esc(x.from_nick)}:</b> ${esc(x.text)}</p>`).join(''))||'<p class="mut">Nada ainda. Manda um oi! 👋</p>')+`</div><div class="row"><input type="text" id="dm-in" maxlength="300" placeholder="Mensagem p/ ${esc(dmWith)}..." style="flex:1"><button class="mbtn small" onclick="dmSend()">➤</button></div>`;
  const mb=$('dm-msgs');if(mb)mb.scrollTop=mb.scrollHeight;
  clearInterval(dmPoll);dmPoll=setInterval(()=>{if(!document.hidden&&dmWith)dmThread();},4000);
}
async function dmSend(){
  const m=needMe();if(!m||!dmWith)return;
  const t=($('dm-in').value||'').trim().slice(0,300);if(!t)return;
  await SUPA.from('dms').insert({pair:dmPair(m.nick,dmWith),from_nick:m.nick,text:t,ts:Date.now()});
  dmThread();
}
/* dmOpen() mora no núcleo (fs-core.js) */
/* ---------- calls voz/vídeo P2P ---------- */
/* calls (voz/vídeo/tela) moram no núcleo fs-core.js */
window.pageReady=chatRender;
bootGate();
</script>
</body>
</html>
